name: iOS — verifica
on:
  push:
    branches: [ios, ia/dreamy-davinci-vtnbe7]
    paths: ["ios/**", ".github/workflows/ios-*.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-*.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Seleziona Xcode 26 stabile
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i -E 'beta|rc' | sort -V | tail -1)
          [ -n "$X" ] || { echo "Nessun Xcode 26 stabile sul runner"; ls /Applications | grep Xcode; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Genera progetto
        working-directory: ios
        run: xcodegen generate
      - name: Test unitari (simulatore, senza firma)
        working-directory: ios
        run: |
          DEST=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulatore: $DEST"
          xcodebuild test -project Eisenlink.xcodeproj -scheme Eisenlink \
            -destination "id=$DEST" CODE_SIGNING_ALLOWED=NO | tee test.log | tail -40
          grep -q "TEST SUCCEEDED" test.log
